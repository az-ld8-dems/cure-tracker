# Keeps the dev tooling and the pinned GitHub Actions current: a weekly check, one pull request per bump. Every PR runs the three-browser
# CI, so the open ones are capped. Security updates come as soon as GitHub has an advisory, whatever the schedule (they need "Dependabot
# security updates" on in the repository settings). Frostline is vendored, so Dependabot does not see it; see vendor/frostline/README.md
# for updating it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it, so a withdrawn or compromised version is usually gone by then.
    cooldown:
      default-days: 7
    ignore:
      # The types follow the Node the project runs on (engines in package.json, the Worker's runtime), so a new major is a decision to
      # make by hand along with that, not a weekly pull request. Minor and patch updates still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The workflows pin each action by full commit SHA with a version comment; Dependabot updates both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
