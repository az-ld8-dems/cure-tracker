name: deploy
# Deploys when something is merged to main. The pull request already ran every check (ci.yml), so this job only builds and deploys.
# Run by hand (Actions > deploy > Run workflow) it redeploys main, for example after changing a secret or a variable in wrangler.jsonc.
# It does not run database migrations: run `npm run db:migrate` by hand first when a change adds one (docs/setup.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  # Deploys run one at a time, in order, and are never cancelled half way.
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `production` environment holds the Cloudflare secrets; restrict it to the `main` branch in the repository settings.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Only main deploys
        run: '[ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::$GITHUB_REF is not main"; exit 1; }'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: tools/build.sh
      - name: Deploy cure-tracker
        run: npx --no-install wrangler deploy # wrangler is a pinned dev dependency (package.json)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
