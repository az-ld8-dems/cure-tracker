name: release
# Runs on a version tag, and deploys. Agents never tag.
#   git tag v1.2.3 <commit on main> && git push origin v1.2.3
# The tag runs the full CI (checks, plus WebKit, Chromium and Firefox as parallel jobs) and the deploy job waits for all of it. Run by
# hand (Actions > release > Run workflow) on any branch it does the same CI and skips the deploy: use that to try the browsers on a
# branch before tagging. Run `npm run db:migrate` by hand before tagging a release that adds a migration (docs/setup.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      browsers: '["webkit","chromium","firefox"]'
      # The runner for the WebKit and Firefox jobs, chosen here and not in ci.yml. Slim saves about 45% of the allowance but a release
      # then waits longer, and a job fails at slim's 15-minute cap. To go back, change this label to `ubuntu-latest`. The Chromium job
      # ignores it and always runs on `ubuntu-latest`, because it carries Lighthouse.
      runner: ubuntu-slim

  deploy:
    needs: ci
    if: github.ref_type == 'tag'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the next step needs main's history
      - name: The tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: tools/build.sh
      - name: Deploy cure-tracker
        run: npx --no-install wrangler deploy # wrangler is a pinned dev dependency (package.json)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
